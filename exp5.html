
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1 style="text-align: center;">Student Registration Form</h1>
    <hr><br>

    <form action="submit.html" method="post">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="fullname"
               placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter valid email address" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Enter password" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender"
               value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender"
               value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender"
               value="Other">
        <label for="other">Other</label>
        <br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="CSE">Computer Science Engineering</option>
            <option value="AI ML">Artificial Intelligence and ML</option>
            <option value="ECE">Electronics and Communication</option>
            <option value="ME">Mechanical Engineering</option>
        </select>
        <br><br>

        <label for="contact">Contact No:</label>
        <input type="tel" id="contact" name="contact"
               placeholder="Enter phone number" required>
        <br><br>

        <label for="address">Address:</label>
        <br>
        <textarea id="address" name="address" rows="5" cols="47" placeholder="Enter your address" required></textarea>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

    <br>
    <hr>

    <footer style="text-align: center;">
        &copy; 2025 Student Registration Portal
    </footer>

</body>
</html>
